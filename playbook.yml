
---
- name: ITLA DevOps Lab - Automatizacion de cinco servidores
  hosts: servidores
  become: true

  tasks:
    - name: Actualizar cache de APT
      ansible.builtin.apt:
        update_cache: true

    - name: Crear usuario itla
      ansible.builtin.user:
        name: itla
        state: present
        create_home: true
        shell: /bin/bash

    - name: Crear carpeta app
      ansible.builtin.file:
        path: /home/itla/app
        state: directory
        owner: itla
        group: itla
        mode: "0755"

    - name: Crear archivo hola.txt
      ansible.builtin.copy:
        content: "Hola mundo desde Ansible - Practica 8 ITLA\n"
        dest: /home/itla/app/hola.txt
        owner: itla
        group: itla
        mode: "0644"

    - name: Instalar cowsay y htop
      ansible.builtin.apt:
        name:
          - cowsay
          - htop
        state: present

    - name: Crear identificacion personalizada
      ansible.builtin.copy:
        content: |
          ==========================================
                    ITLA DEVOPS LAB
          ==========================================

          Proyecto: Practica 8 - Ansible y Docker
          Responsable: Jeffrey Mercado
          Matricula: 2022-0443

          Servidor: {{ inventory_hostname }}
          Sistema: Ubuntu 24.04
          Administracion: Ansible

          Estado: Configurado automaticamente

          ==========================================
        dest: /home/itla/app/identidad.txt
        owner: itla
        group: itla
        mode: "0644"

    - name: Crear mensaje de bienvenida del laboratorio
      ansible.builtin.copy:
        content: |
          Bienvenido a ITLA DevOps Lab
          Servidor: {{ inventory_hostname }}
          Administrado mediante Ansible
        dest: /etc/motd
        mode: "0644"
